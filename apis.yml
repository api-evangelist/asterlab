aid: asterlab
name: Asterlab
description: >-
  Aster (Aster AI Labs, PBC), operating as Asterlab, is a San Francisco based Y Combinator
  (Spring 2026) public benefit corporation building autonomous research systems that coordinate
  thousands of AI research agents working in parallel to automate open-ended scientific discovery.
  The company used that same autonomous-research system to optimize its own inference stack and now
  offers Aster Inference, an OpenAI-compatible inference API serving open-weight models (gpt-oss-120b,
  gpt-oss-120b-fast, and Z.ai's GLM 5.2) at what it benchmarks as the fastest gpt-oss-120b output
  speed on GPU (644 tok/s). The API works with the official OpenAI Python and JS SDKs, LangChain,
  LiteLLM, Cursor, the Vercel AI SDK, and most agent frameworks by pointing the base URL at
  https://api.asterlab.ai/v1, with zero data retention by default.
